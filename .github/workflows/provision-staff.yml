
name: Provision ALMASI Staff Account

on:
  workflow_dispatch:
    inputs:
      name:
        description: Account holder's name
        required: true
        type: string
      email:
        description: Account email address
        required: true
        type: string
      role:
        description: Staff role
        required: true
        type: choice
        options:
          - administrator
          - facilitator
          - supervisor

permissions:
  contents: read

jobs:
  provision-staff:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Provision staff account
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
          STAFF_NAME: ${{ inputs.name }}
          STAFF_EMAIL: ${{ inputs.email }}
          STAFF_ROLE: ${{ inputs.role }}
        run: |
          python - <<'PY'
          import os
          import sys
          from sqlalchemy.engine import make_url

          required = [
              "DATABASE_URL",
              "STAFF_NAME",
              "STAFF_EMAIL",
              "STAFF_ROLE",
              "STAFF_PASSWORD",
          ]

          missing = [key for key in required if not os.getenv(key)]
          if missing:
              print("Missing required variables:", ", ".join(missing))
              sys.exit(1)

          raw_url = os.environ["DATABASE_URL"].strip()

          if raw_url.startswith("postgres://"):
              database_url = "postgresql+psycopg://" + raw_url.removeprefix("postgres://")
          elif raw_url.startswith("postgresql://"):
              database_url = "postgresql+psycopg://" + raw_url.removeprefix("postgresql://")
          else:
              database_url = raw_url

          try:
              parsed_url = make_url(database_url)
              print("Database URL format is valid.")
              print("Database driver:", parsed_url.drivername)
          except Exception:
              print("DATABASE_URL is malformed.")
              print("Check URL format and password encoding.")
              sys.exit(1)

          os.environ["DATABASE_URL"] = database_url

          from sqlalchemy import select
          from app.db.session import SessionLocal
          from app.models import User
          from app.provision_user import provision_staff_account

          email = os.environ["STAFF_EMAIL"].strip().lower()

          with SessionLocal() as db:
              existing = db.scalar(select(User).where(User.email == email))

              user = provision_staff_account(
                  db,
                  name=os.environ["STAFF_NAME"],
                  email=email,
                  role=os.environ["STAFF_ROLE"],
                  password=os.environ["STAFF_PASSWORD"],
              )

              print(f"Successfully provisioned {user.role} account for {user.email}.")
          PY
