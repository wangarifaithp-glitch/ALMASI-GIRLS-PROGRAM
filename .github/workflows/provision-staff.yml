name: Provision ALMASI Staff Account

on:
  workflow_dispatch:
    inputs:
      name:
        description: Account holder's name
        required: true
        type: string
      email:
        description: Account email address
        required: true
        type: string
      role:
        description: Staff role
        required: true
        type: choice
        options:
          - administrator
          - facilitator
          - supervisor

permissions:
  contents: read

jobs:
  provision-staff:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Provision staff account
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
          STAFF_NAME: ${{ inputs.name }}
          STAFF_EMAIL: ${{ inputs.email }}
          STAFF_ROLE: ${{ inputs.role }}
        run: |
          python - <<'PY'
          import os
          import sys

          from sqlalchemy import select
          from app.db.session import SessionLocal
          from app.models import User
          from app.provision_user import provision_staff_account

          required = [
              "DATABASE_URL",
              "STAFF_NAME",
              "STAFF_EMAIL",
              "STAFF_ROLE",
              "STAFF_PASSWORD",
          ]

          missing = [key for key in required if not os.getenv(key)]
          if missing:
              print("Missing required GitHub secrets or inputs:", ", ".join(missing))
              sys.exit(1)

          email = os.environ["STAFF_EMAIL"].strip().lower()

          with SessionLocal() as db:
              existing = db.scalar(select(User).where(User.email == email))

              if existing is not None:
                  print("This email already exists. No account was changed.")
                  sys.exit(1)

              user = provision_staff_account(
                  db,
                  name=os.environ["STAFF_NAME"],
                  email=email,
                  role=os.environ["STAFF_ROLE"],
                  password=os.environ["STAFF_PASSWORD"],
              )

              print(f"Successfully provisioned {user.role} account for {user.email}.")
          PY
